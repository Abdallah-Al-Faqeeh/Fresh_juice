<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main-page</title>
    <style>
        .copyright {
            text-align: center;
            font-size: 12px;
            opacity: calc(0.7);
            color: #020202;
            margin: 0;
            background-color: rgb(255, 255, 255);
            padding: 0;
        }
        .footer-line {
            height: 1px;
            background-color: #d7e8df;
            border: 1px dashed rgb(151, 113, 105);
        }

    </style>
    <link rel="stylesheet" href="./Style.css">
    
</head>
<body>
    <main class="AllContent">
            <section id="home" class="hero-section">

             <div class="container hero-content">
                   <div class="hero-text">
                    <h1>
                        Fresh Juice,<br>
                        <span>Fresh Mood!</span>
                    </h1>
                     <p class="samll-title">
                        Natural <span>•</span> Fresh
                        <span>•</span> Delicious
                    </p>
                    <a href="#menu" class="main-button">
                    View Menu <span> →</span></a>
                </div>
                </div>
            </section>


            <section id="menu" class="menu-section">
            </section>
            <script>
                function loadPage(event){
                    event.preventDefault();
                    const url = event.target.href;
                    fetch(url).then(Response => Response.text()).then(data => {document.getElementById("menu").innerHTML = data;});
                }
                loadPage({
                    preventDefault: () => {},
                    target: {href:"./Menu/index.html"}
                })
            </script>
            <section id="about_us" class="about-section">

            </section>
            <script>
                function loadPage(event){
                    event.preventDefault();
                    const url = event.target.href;
                    fetch(url).then(Response => Response.text()).then(data => {document.getElementById("about_us").innerHTML = data;});
                }
                loadPage({
                    preventDefault: () => {},
                    target: {href:"./about_us/about.html"}
                })
            </script>
            <section id="contact" class="contact-section">

            </section>

       <script>
                function loadPage(event){
                    event.preventDefault();
                    const url = event.target.href;
                    fetch(url).then(Response => Response.text()).then(data => {document.getElementById("contact").innerHTML = data;});
                }
                loadPage({
                    preventDefault: () => {},
                    target: {href:"./contact/contact.html"}
                })
            </script>
     
        </main>
        <footer>
     
            <div class="footer-line"></div>
            <p class="copyright">
            © 2026 Fresh Juice. All rights reserved.
        </p>
    
        </footer>
</body>
</html>
